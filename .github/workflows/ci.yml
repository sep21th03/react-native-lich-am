name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    env:
      # đặt secret này nếu muốn CI kiểm chứng đầy đủ 1.462 ngày
      CALENDAR_FULL_URL: ${{ secrets.CALENDAR_FULL_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # lib/ được commit kèm package để cài là chạy. Bước này dựng lại từ src/
      # rồi so với bản đã commit — lệch nghĩa là quên chạy `npm run build`.
      - name: Dựng lại lib/ từ src/ và kiểm tra khớp bản đã commit
        run: |
          npm run build
          git diff --exit-code -- lib core dataset ui

      - name: Smoke test
        run: npm run smoke

      # verify cần calendar_full.json (18,6 MB, không nằm trong repo).
      # Khi có secret CALENDAR_FULL_URL thì bật kiểm chứng đầy đủ 1.462 ngày.
      - name: Verify toàn bộ 1.462 ngày (tuỳ chọn)
        if: ${{ env.CALENDAR_FULL_URL != '' }}
        run: |
          curl -fsSL "$CALENDAR_FULL_URL" -o /tmp/calendar_full.json
          node scripts/verify.mjs /tmp/calendar_full.json

      - name: Kiểm tra gói publish
        run: npm pack --dry-run
